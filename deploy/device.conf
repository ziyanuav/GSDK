# 紫燕 GSDK — NanoPC-T4 部署设备配置（示例）
# 复制为 device.conf 后按现场修改（device.conf 已加入 .gitignore，不会提交）
#
#   cp deploy/device.conf.example deploy/device.conf
#
# 也可指定其他路径:
#   export ZYGSDK_DEPLOY_CONF=/path/to/my_device.conf

# 设备 IP 或主机名（必填，用于 SCP/SSH 快速部署）
DEVICE_HOST=192.168.1.199

# SSH 登录用户（默认 root）
DEVICE_USER=root

# SSH 端口（默认 22）
DEVICE_PORT=22

# SSH 密码（可选；留空则使用 SSH 密钥或交互输入密码）
# 若已配置免密登录，请留空
DEVICE_PASSWORD=ziyanuav2292536

# SSH 私钥路径（可选，例如 ~/.ssh/id_rsa）
# SSH_KEY=

# 额外 SSH/SCP 参数（可选，例如 -o StrictHostKeyChecking=no）
# SSH_OPTS=

# 远程临时目录（上传 tar.gz 的位置，默认 /tmp）
REMOTE_TMP=/tmp

# 设备安装目录（默认 /opt/zygsdk）
INSTALL_DIR=/opt/zygsdk
